<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perpetual Electromagnetic Eddy Art Display</title>
    <style>
        :root {
            --bg-color: #080c14;
            --panel-bg: #111827;
            --border-color: #1f293d;
            --accent-cyan: #00f3ff;
            --accent-purple: #a855f7;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 24px;
            max-width: 1100px;
            width: 100%;
        }

        @media (max-width: 850px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* Display Shadow Box Frame */
        .display-frame {
            background: linear-gradient(145deg, #162032, #0d1320);
            border: 4px solid #27354f;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(0, 243, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .display-frame::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(0, 243, 255, 0.03) 0%, transparent 70%);
            pointer-events: none;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #04060a;
            border-radius: 10px;
            border: 2px solid #1a2538;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Gantry Indicator Overlay */
        .gantry-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            pointer-events: none;
            transition: transform 0.1s linear;
        }

        /* Control Console Panel */
        .control-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .panel-header h2 {
            font-size: 1.1rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--accent-cyan);
            margin-bottom: 4px;
        }

        .panel-header p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .control-label span:last-child {
            color: var(--accent-cyan);
            font-family: monospace;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #1f293d;
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent-cyan);
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-cyan);
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            background: linear-gradient(135deg, #1f293d, #111827);
            border: 1px solid #374151;
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.2);
        }

        button.active {
            background: var(--accent-cyan);
            color: #000;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }

        .status-bar {
            margin-top: 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Kinetic Art Display -->
        <div class="display-frame">
            <div class="canvas-container">
                <div id="gantry" class="gantry-bar"></div>
                <canvas id="simCanvas"></canvas>
            </div>
            <div class="status-bar">SYSTEM STATUS: <span id="statusText" style="color: #10b981;">ACTIVE [EDDY MATRIX LOCKED]</span></div>
        </div>

        <!-- Rotary & Tactile Control Console -->
        <div class="control-panel">
            <div class="panel-header">
                <h2>Encoder Console</h2>
                <p>Hardware Control Interface</p>
            </div>

            <div class="control-group">
                <div class="control-label">
                    <span>Vortex Intensity</span>
                    <span id="valVortex">5.0</span>
                </div>
                <input type="range" id="vortexPower" min="0" max="10" step="0.1" value="5.0">
            </div>

            <div class="control-group">
                <div class="control-label">
                    <span>Global Drift</span>
                    <span id="valDrift">2.0</span>
                </div>
                <input type="range" id="driftSpeed" min="-5" max="5" step="0.1" value="2.0">
            </div>

            <div class="control-group">
                <div class="control-label">
                    <span>X-Y Nozzle Rate</span>
                    <span id="valSpawn">3.0</span>
                </div>
                <input type="range" id="spawnRate" min="0" max="10" step="0.5" value="3.0">
            </div>

            <div class="control-group">
                <div class="control-label">
                    <span>Backlight Glow</span>
                    <span id="valGlow">7.0</span>
                </div>
                <input type="range" id="backlightGlow" min="0" max="10" step="0.5" value="7.0">
            </div>

            <div class="btn-grid">
                <button id="btnPulse" onclick="triggerPulse()">Magnetic Pulse</button>
                <button id="btnClear" onclick="clearCanvas()">Clear Particles</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const gantry = document.getElementById('gantry');

        // Controls
        const sliderVortex = document.getElementById('vortexPower');
        const sliderDrift = document.getElementById('driftSpeed');
        const sliderSpawn = document.getElementById('spawnRate');
        const sliderGlow = document.getElementById('backlightGlow');

        const valVortex = document.getElementById('valVortex');
        const valDrift = document.getElementById('valDrift');
        const valSpawn = document.getElementById('valSpawn');
        const valGlow = document.getElementById('valGlow');

        // Resize canvas to match container resolution
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Simulation parameters
        let particles = [];
        let gantryX = 0;
        let gantryDir = 1;
        let pulseTimer = 0;

        // Electromagnetic Eddy Centers
        const eddies = [
            { x: 0.3, y: 0.3, strength: 1 },
            { x: 0.7, y: 0.3, strength: -1 },
            { x: 0.3, y: 0.7, strength: -1 },
            { x: 0.7, y: 0.7, strength: 1 },
            { x: 0.5, y: 0.5, strength: 1.5 }
        ];

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = Math.random() * 1 + 0.5;
                this.size = Math.random() * 1.5 + 1;
                this.color = Math.random() > 0.3 ? '#00f3ff' : '#a855f7';
            }

            update(vortexPower, drift, width, height) {
                // Apply forces from electromagnetic eddies
                eddies.forEach(eddy => {
                    let ex = eddy.x * width;
                    let ey = eddy.y * height;
                    let dx = ex - this.x;
                    let dy = ey - this.y;
                    let distSq = dx * dx + dy * dy + 400; // damping factor
                    
                    // Rotational force (curl)
                    let force = (eddy.strength * vortexPower * 500) / distSq;
                    this.vx += -dy * force * 0.0005;
                    this.vy += dx * force * 0.0005;
                });

                // Global drift / gravity
                this.vx += drift * 0.05;

                // Apply velocity with friction
                this.vx *= 0.96;
                this.vy *= 0.96;

                this.x += this.vx;
                this.y += this.vy;

                // Boundary collision / containment
                if (this.x < 10) { this.x = 10; this.vx *= -0.5; }
                if (this.x > width - 10) { this.x = width - 10; this.vx *= -0.5; }
                if (this.y < 10) { this.y = 10; this.vy *= -0.5; }
                if (this.y > height - 10) { this.y = height - 10; this.vy *= -0.5; }
            }

            draw(ctx) {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        function triggerPulse() {
            pulseTimer = 30;
            eddies.forEach(e => e.strength *= -1); // Reverse polarity wave
            document.getElementById('btnPulse').classList.add('active');
            setTimeout(() => document.getElementById('btnPulse').classList.remove('active'), 300);
        }

        function clearCanvas() {
            particles = [];
        }

        // Main animation loop
        function animate() {
            const width = canvas.clientWidth;
            const height = canvas.clientHeight;

            // Update UI text values
            valVortex.textContent = parseFloat(sliderVortex.value).toFixed(1);
            valDrift.textContent = parseFloat(sliderDrift.value).toFixed(1);
            valSpawn.textContent = parseFloat(sliderSpawn.value).toFixed(1);
            valGlow.textContent = parseFloat(sliderBacklightGlow = sliderGlow.value).toFixed(1);

            // Draw LED Backlight Matrix Background
            ctx.fillStyle = `rgba(4, 6, 10, ${0.3 - (sliderGlow.value * 0.02)})`;
            ctx.fillRect(0, 0, width, height);

            // Draw subtle matrix glow dots for background aesthetics
            ctx.fillStyle = `rgba(0, 243, 255, ${sliderGlow.value * 0.015})`;
            for (let rx = 20; rx < width; rx += 40) {
                for (let ry = 20; ry < height; ry += 40) {
                    ctx.fillRect(rx, ry, 1.5, 1.5);
                }
            }

            // Move X-Y Gantry Hopper
            let spawnRate = parseFloat(sliderSpawn.value);
            if (spawnRate > 0) {
                gantryX += gantryDir * (spawnRate * 0.8);
                if (gantryX > width - 20 || gantryX < 20) {
                    gantryDir *= -1;
                }
                gantry.style.transform = `translateX(${gantryX}px)`;

                // Spawn particles from gantry nozzle
                if (Math.random() < spawnRate * 0.15 && particles.length < 1500) {
                    particles.push(new Particle(gantryX, 15));
                }
            }

            // Pulse effect decay
            let currentVortex = parseFloat(sliderVortex.value);
            if (pulseTimer > 0) {
                currentVortex *= 3;
                pulseTimer--;
            }

            let currentDrift = parseFloat(sliderDrift.value);

            // Update and Render Ferromagnetic Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update(currentVortex, currentDrift, width, height);
                p.draw(ctx);
            }

            requestAnimationFrame(animate);
        }

        // Initialize start batch of sand
        setTimeout(() => {
            for (let i = 0; i < 300; i++) {
                particles.push(new Particle(Math.random() * canvas.clientWidth, Math.random() * canvas.clientHeight));
            }
        }, 100);

        animate();
    </script>
</body>
</html>
